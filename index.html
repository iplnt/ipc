<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="https://blogger.googleusercontent.com/img/a/AVvXsEis64DMk_3-uwcnMyzAlE7hWtcD8rhMSFsQtb-A1JmNbfxPg0U2JP08cgxxKNdwnC_s2hvbNxUK5MqctD3FoIxXmL2Dr5WQTT6nv71Seo-LavvKArKyT9eSwFMRcCGehQ-u-8naqJ3bwk9nAxIrILhpp_i1i_fkJ5WRc2CKxJpyXJkUxYqlPFInJX4Zc1nt" type="image/x-icon">
  <title>IP Finanzas</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#005490"> <!-- Azul de Interplanet -->
  
  <!-- Aquí puedes poner la ruta a tu ícono en la carpeta assets, o un enlace de Blogger como hiciste en IP Wallet -->
  <link rel="apple-touch-icon" https://blogger.googleusercontent.com/img/a/AVvXsEis64DMk_3-uwcnMyzAlE7hWtcD8rhMSFsQtb-A1JmNbfxPg0U2JP08cgxxKNdwnC_s2hvbNxUK5MqctD3FoIxXmL2Dr5WQTT6nv71Seo-LavvKArKyT9eSwFMRcCGehQ-u-8naqJ3bwk9nAxIrILhpp_i1i_fkJ5WRc2CKxJpyXJkUxYqlPFInJX4Zc1nt">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Iconos para el botón de instalar -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Estilos para el iframe a pantalla completa (Como lo tenías en IP Wallet) */
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      background-color: #f8fafc; /* Color de fondo base de Interplanet */
    }
    iframe { 
      border: none; 
      width: 100%; 
      height: 100%; 
      display: block; 
    }

    /* Estilos del botón flotante de instalación */
    #btn-instalar {
      display: none; /* Oculto por defecto */
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #4338ca; /* Azul corporativo */
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(67, 56, 202, 0.4);
      z-index: 9999; 
      cursor: pointer;
      align-items: center;
      gap: 10px;
    }
    #btn-instalar:active {
      transform: translateX(-50%) scale(0.95);
    }
  </style>
</head>
<body>

  <!-- BOTÓN DE INSTALACIÓN -->
  <button id="btn-instalar">
    <i class="fa-solid fa-download"></i> Instalar App
  </button>

  <!-- AQUÍ PONES EL ENLACE DE TU SCRIPT DE INTERPLANET -->
  <iframe src="https://script.google.com/macros/s/AKfycbwC6ufdmKswFWgWq7MN4vMja3O7p5cTfQINN8b7xbyWxcXhYFlaPEn7heZ0I90Vupiq9Q/exec" allowfullscreen></iframe>

  <script>
    // 1. REGISTRO DEL SERVICE WORKER (De tu código original)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker registrado con éxito:', registration.scope);
          })
          .catch(error => {
            console.log('Error al registrar el ServiceWorker:', error);
          });
      });
    }

    // 2. LÓGICA DEL BOTÓN DE INSTALACIÓN
    let eventoInstalacionDiferido;
    const btnInstalar = document.getElementById('btn-instalar');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); // Evita el banner por defecto
      eventoInstalacionDiferido = e; // Guarda el evento
      btnInstalar.style.display = 'flex'; // Muestra nuestro botón flotante
    });

    btnInstalar.addEventListener('click', async () => {
      btnInstalar.style.display = 'none'; // Oculta el botón
      eventoInstalacionDiferido.prompt(); // Lanza la ventana nativa del celular
      const { outcome } = await eventoInstalacionDiferido.userChoice;
      eventoInstalacionDiferido = null;
    });

    window.addEventListener('appinstalled', () => {
      btnInstalar.style.display = 'none';
      eventoInstalacionDiferido = null;
    });
  </script>

</body>
</html>
