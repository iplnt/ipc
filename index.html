<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="https://blogger.googleusercontent.com/img/a/AVvXsEis64DMk_3-uwcnMyzAlE7hWtcD8rhMSFsQtb-A1JmNbfxPg0U2JP08cgxxKNdwnC_s2hvbNxUK5MqctD3FoIxXmL2Dr5WQTT6nv71Seo-LavvKArKyT9eSwFMRcCGehQ-u-8naqJ3bwk9nAxIrILhpp_i1i_fkJ5WRc2CKxJpyXJkUxYqlPFInJX4Zc1nt" type="image/x-icon">
  <title>IP Finanzas</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#005490">
  
  <link rel="apple-touch-icon" href="https://blogger.googleusercontent.com/img/a/AVvXsEis64DMk_3-uwcnMyzAlE7hWtcD8rhMSFsQtb-A1JmNbfxPg0U2JP08cgxxKNdwnC_s2hvbNxUK5MqctD3FoIxXmL2Dr5WQTT6nv71Seo-LavvKArKyT9eSwFMRcCGehQ-u-8naqJ3bwk9nAxIrILhpp_i1i_fkJ5WRc2CKxJpyXJkUxYqlPFInJX4Zc1nt">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      background-color: #f8fafc; 
    }
    iframe { 
      border: none; 
      width: 100%; 
      height: 100%; 
      display: block; 
    }

    #btn-instalar {
      display: none; 
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #4338ca; 
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(67, 56, 202, 0.4);
      z-index: 9999; 
      cursor: pointer;
      align-items: center;
      gap: 10px;
    }
    #btn-instalar:active {
      transform: translateX(-50%) scale(0.95);
    }
  </style>
</head>
<body>

  <button id="btn-instalar">
    <i class="fa-solid fa-download"></i> Instalar App
  </button>

  <!-- EL IFRAME INICIA VACÍO, JAVASCRIPT LE PONDRÁ LA URL CORRECTA -->
  <iframe id="iframe-ip-finanzas" allowfullscreen></iframe>

  <script>
    // =========================================================================
    // 0. LÓGICA DE ENRUTAMIENTO (NUEVO)
    // =========================================================================
    // Esta es la URL de tu script de Google principal
    const urlScriptBase = "https://script.google.com/macros/s/AKfycbxgaL6g-mJm0xxhH7P3XfZaswrixF9J1KKhIh-TTSplMegAJOFCe9tdmnGSIJEzF-wORA/exec";
    
    // Obtenemos si hay parámetros en el enlace (ej: ?vista=cliente)
    const parametros = window.location.search;
    
    // Le inyectamos la URL completa al iframe
    document.getElementById('iframe-ip-finanzas').src = urlScriptBase + parametros;


    // =========================================================================
    // 1. REGISTRO DEL SERVICE WORKER
    // =========================================================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker registrado con éxito:', registration.scope);
          })
          .catch(error => {
            console.log('Error al registrar el ServiceWorker:', error);
          });
      });
    }

    // =========================================================================
    // 2. LÓGICA DEL BOTÓN DE INSTALACIÓN
    // =========================================================================
    let eventoInstalacionDiferido;
    const btnInstalar = document.getElementById('btn-instalar');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); 
      eventoInstalacionDiferido = e; 
      
      // No mostramos el botón de instalar si el cliente solo viene a consultar su crédito
      if (!parametros.includes('vista=cliente')) {
          btnInstalar.style.display = 'flex'; 
      }
    });

    btnInstalar.addEventListener('click', async () => {
      btnInstalar.style.display = 'none'; 
      eventoInstalacionDiferido.prompt(); 
      const { outcome } = await eventoInstalacionDiferido.userChoice;
      eventoInstalacionDiferido = null;
    });

    window.addEventListener('appinstalled', () => {
      btnInstalar.style.display = 'none';
      eventoInstalacionDiferido = null;
    });
  </script>

</body>
</html>
