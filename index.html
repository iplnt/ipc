<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IP Finanzas</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4338ca">
  <link rel="apple-touch-icon" href="assets/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* CSS para que el Iframe ocupe el 100% de la pantalla sin bordes */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Evita doble scroll */
      background-color: #f8fafc;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe src="https://script.google.com/macros/s/AKfycbw2lc2Vaa9KD3uNW8tcUWCOpODDLr6XTlk2jTfC-nJlkLRmDiAxAwIb6EgoJp7UBSZ7yw/exec" allowfullscreen></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Lista y registrada.'))
          .catch(err => console.error('Error en PWA:', err));
      });
    }
  </script>
</body>
</html>
